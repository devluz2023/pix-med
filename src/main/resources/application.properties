spring.application.name=pix-med
spring.datasource.url=jdbc:mysql://localhost:3306/pix_db?useSSL=false&serverTimezone=UTC
spring.datasource.username=pix_user
spring.datasource.password=pix_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# O Hibernate vai criar ou atualizar as tabelas automaticamente (use 'validate' em produção)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true